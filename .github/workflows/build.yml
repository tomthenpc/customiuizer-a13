name: Build

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check source invariants and System migration
        run: |
          python tools/check-invariants.py
          python tools/audit-system-migration.py --baseline-ref 8df0c3ded351c4cf2a0401a0a470d00103c2ad76
          python tools/audit-architecture.py
          python tools/audit-prefs.py
          python tools/audit-canary-sequence.py
          python tools/audit-catalog-contracts.py

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run debug and release lint
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Run release vital lint independently
        run: ./gradlew :app:lintVitalRelease --rerun-tasks

      - name: Build debug APK and exercise release code path (R8, no signing)
        run: ./gradlew :app:assembleDebug :app:minifyReleaseWithR8

      - name: Scan for legacy Xposed API references
        shell: bash
        run: |
          if grep -R "de.robv.android.xposed" app/src/main/java app/build.gradle.kts; then
            echo "Legacy Xposed API references found"
            exit 1
          fi

      - name: Verify Xposed metadata and applicationId
        shell: bash
        run: |
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" META-INF/xposed/module.prop | grep -qx 'minApiVersion=101'
          unzip -p "$apk" META-INF/xposed/module.prop | grep -qx 'targetApiVersion=102'
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -qx 'tv.withaibuild.customiuizer.MainModule'
          "$aapt2_path" dump badging "$apk" | grep -q "package: name='tv.withaibuild.customiuizer.r13'"
          "$aapt2_path" dump badging "$apk" | grep -q "minSdkVersion:'33'"
          "$aapt2_path" dump badging "$apk" | grep -q "targetSdkVersion:'34'"

          scope="$(unzip -p "$apk" META-INF/xposed/scope.list)"

          printf '%s\n' "$scope" | grep -qx 'system'
          printf '%s\n' "$scope" | grep -qx 'android'
          printf '%s\n' "$scope" | grep -qx 'com.android.systemui'
          printf '%s\n' "$scope" | grep -qx 'com.miui.home'
          printf '%s\n' "$scope" | grep -qx 'com.mi.android.globallauncher'

          if printf '%s\n' "$scope" | grep -qx 'system_server'; then
              echo "scope.list must use system, not system_server"
              exit 1
          fi

          duplicates="$(
              printf '%s\n' "$scope" |
              sed '/^[[:space:]]*$/d' |
              sort |
              uniq -d
          )"

          test -z "$duplicates"

      - uses: actions/upload-artifact@v4
        with:
          name: CustoMIUIzer_forA13_debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
