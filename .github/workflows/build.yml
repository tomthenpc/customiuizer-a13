name: Verify

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Static invariants and architecture audits
        run: |
          python tools/check-invariants.py
          python tools/audit-system-migration.py --baseline-ref 8df0c3ded351c4cf2a0401a0a470d00103c2ad76
          python tools/audit-architecture.py
          python tools/audit-prefs.py
          python tools/audit-canary-sequence.py
          python tools/audit-catalog-contracts.py

      - name: Full local verification
        run: python tools/verify.py full
