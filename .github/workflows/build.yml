name: Build

on:
  push:
    branches: [main, "agent/**", "devin/**", "r13/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: ./gradlew :app:test :app:lintRelease

      - name: Build debug APK and exercise release code path (R8, no signing)
        run: ./gradlew :app:assembleDebug :app:minifyReleaseWithR8

      - name: Scan for legacy Xposed API references
        shell: bash
        run: |
          if grep -R "de.robv.android.xposed" app/src/main/java app/build.gradle.kts; then
            echo "Legacy Xposed API references found"
            exit 1
          fi

      - name: Verify Xposed metadata and applicationId
        shell: bash
        run: |
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" META-INF/xposed/module.prop | grep -qx 'minApiVersion=101'
          unzip -p "$apk" META-INF/xposed/module.prop | grep -qx 'targetApiVersion=102'
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -qx 'name.monwf.customiuizer.MainModule'
          "$aapt2_path" dump badging "$apk" | grep -q "package: name='tv.withaibuild.customiuizer.r13'"
          "$aapt2_path" dump badging "$apk" | grep -q "minSdkVersion:'33'"
          "$aapt2_path" dump badging "$apk" | grep -q "targetSdkVersion:'34'"

      - uses: actions/upload-artifact@v4
        with:
          name: CustoMIUIzer_forA13_debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
