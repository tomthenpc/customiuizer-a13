name: A13 Fast CI

on:
  push:
    branches:
      - devin/a13-rom-intelligence-audit
  pull_request:
    branches:
      - devin/a13-rom-intelligence-audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Static checkers
        run: |
          python tools/check-invariants.py
          python tools/check-compat-contracts.py
          python tools/check_automation_state.py
          python tools/check_document_contracts.py
          python tools/check_goal_constitution.py
          python tools/progress_snapshot.py --check

      - name: Compile and test
        run: |
          ./gradlew :app:compileDebugKotlin
          ./gradlew :app:compileDebugJavaWithJavac
          ./gradlew :app:testDebugUnitTest

      - name: Lint and safe debug build
        run: |
          ./gradlew :app:lintDebug
          ./gradlew :app:assembleDebug
