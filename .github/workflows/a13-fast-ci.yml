name: A13 Fast CI

permissions:
  contents: read

on:
  push:
    branches:
      - devin/a13-rom-intelligence-audit
  pull_request:
    branches:
      - devin/a13-rom-intelligence-audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Static checkers
        run: |
          python tools/check-invariants.py
          python tools/check-compat-contracts.py
          python tools/check_hook_contract_parity.py

      - name: Compile and test
        run: |
          ./gradlew :app:compileDebugKotlin
          ./gradlew :app:compileDebugJavaWithJavac
          ./gradlew :app:testDebugUnitTest

      - name: Brutal suite (read-only gates)
        run: |
          python tools/catalog_contract_probe.py --catalog app/src/main/java/tv/withaibuild/customiuizer/mods/catalog/FeatureCatalog.kt --feature-id app/src/main/java/tv/withaibuild/customiuizer/mods/catalog/FeatureId.kt --diagnostic-ids app/src/main/java/tv/withaibuild/customiuizer/mods/diagnostics/DiagnosticIds.kt --matrix docs/rom-intelligence/A13_PROCESS_MATRIX.md
          python tools/ci_contract_scan.py --expected-branch devin/a13-rom-intelligence-audit --default-branch main
          python tools/source_hazard_scan.py --path app/src/main/java
          python tools/hook_surface_probe.py
          python tools/brutal_test_runner.py --config tools/brutal_test_config.json hermeticity

      - name: Lint and safe debug build
        run: |
          ./gradlew :app:lintDebug
          ./gradlew :app:assembleDebug
