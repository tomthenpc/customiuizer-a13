apply plugin: 'com.android.application'

//def acraVersion = '5.7.0'
def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.isFile()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def lastVersion = 116
def lastVersionName = "r13.1.1"

android {
    namespace "name.monwf.customiuizer"
    signingConfigs {
        if (hasReleaseSigning) {
            v2 {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled false
                v2SigningEnabled true
            }
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId "tv.withaibuild.customiuizer.r13"
        minSdkVersion 33
        //noinspection OldTargetApi,ExpiredTargetSdkVersion
        targetSdkVersion 34
        versionCode lastVersion
        versionName lastVersionName
        buildConfigField "long", "BUILD_TIME", System.currentTimeMillis() + "L"
        resConfigs 'ru-rRU', 'zh-rCN', 'zh-rTW', 'ja-rJP', 'vi-rVN', 'cs-rCZ', 'pt-rBR', 'tr-rTR', 'es-rES'
        ndk { abiFilters "arm64-v8a" }
    }
    def releaseSigning = hasReleaseSigning ? signingConfigs.v2 : signingConfigs.debug

    buildTypes {
        develop {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            crunchPngs true
            signingConfig releaseSigning
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            signingConfig releaseSigning
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += ['META-INF/*.kotlin_module', 'META-INF/androidx.*.version', '**.kotlin_builtins', '**.kotlin_metadata']
        }
    }
    androidResources {
        noCompress 'zip'
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            setProperty("outputFileName", "CustoMIUIzer-A13-${lastVersionName}.apk")
        }
    }
//    gradle.projectsEvaluated {
//        tasks.withType(JavaCompile) {
//            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
//        }
//    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    //    implementation "ch.acra:acra-core:$acraVersion"
//    noinspection DifferentStdlibGradleVersion
    compileOnly files('lib/miuisystem.jar')
    compileOnly files('lib/framework.jar')
    compileOnly "io.github.libxposed:api:101.0.1"

    implementation "io.github.libxposed:service:101.0.0"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
//    implementation "androidx.recyclerview:recyclerview:1.2.1"
//    implementation 'com.google.android.flexbox:flexbox:3.0.0'
//    implementation 'com.google.android.material:material:1.6.1'
}
